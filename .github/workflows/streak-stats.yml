name: Generate GitHub Streak Stats

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate-streak:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create generated assets directory
        run: mkdir -p generated

      - name: Generate streak statistics
        uses: DenverCoder1/github-readme-streak-stats@main

        with:
          user: Ravneet-project
          theme: github-dark-blue
          hide_border: true
          output: generated/streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated streak image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/streak-stats.svg
          git diff --cached --quiet || git commit -m "Update GitHub streak statistics"
          git push
