name: Generate Robot Cat Contribution Graph

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */12 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/robot-cat.yml"
      - ".github/scripts/generate-robot-cat.mjs"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Robot Cat Contribution SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Ravneet-project
        run: |
          node .github/scripts/generate-robot-cat.mjs

      - name: Publish SVG to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
